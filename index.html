<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <script src="./app.js"></script>

    <div class="box">
      <div class="obshiy">
        <div class="birinchi-tomon">
          <h1 class="rezult">Your Result</h1>
          <div class="oval">
            <h1>76</h1>
            <p>of 100</p>
          </div>

          <h2 class="oval-titul">Great</h2>
          <p class="oval-text">
            Your performance exceed 65% of the people conducting the test here!
          </p>
        </div>

        <div class="ikkinchi-tomon">

          <div class="summary-energy">
            <p class="icons">
              <img src="./images/energy.svg" alt="energy" />

            </p>
            <p class="son"><br />80 / 100</p>
          </div>
          <div class="summary-memory">
            <p class="icons">
              <img src="./images/brain.svg" alt="brain" /> Memory
            </p>

          </div>
          <div class="summary-komment">
            <p class="icons">
              <img src="./images/komment.svg" alt="komment" />

            </p>
            <p class="son"><br />61 / 100</p>
          </div>
          <div class="summary-eye">
            <p class="icons">
              <img src="./images/eye.svg" alt="eye" />
              Visual
            </p>
            <p class="son"><br />73 / 100</p>
          </div>
          <button class="button">Continue</button>
        </div>
      </div>
    </div>
